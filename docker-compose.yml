# Lab Topic 09 — tuần 8: Keycloak (realm topic09) + Envoy (TLS 1.3, P1 :8443 / P0 :8444 / P2 :8445) + auth-svc + OPA + 2 backend
#                        + SIEM: Vector (gom, chuẩn hoá, giả danh) → OpenSearch.
# Chạy:  cp .env.example .env  (rồi đổi mật khẩu, sinh SIEM_HMAC_KEY)  →  docker compose up -d --build
name: topic09-lab

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0      # ghim phiên bản, không dùng :latest
    # --import-realm: lúc khởi động, import mọi file .json trong /opt/keycloak/data/import.
    # Realm đã tồn tại thì bỏ qua (không ghi đè) — muốn import lại phải xoá realm topic09 trước.
    command: ["start-dev", "--import-realm"]     # chế độ dev: HTTP, DB nội bộ — chỉ dùng cho lab
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?Hay dat KC_ADMIN_PASSWORD trong file .env}
      KC_HEALTH_ENABLED: "true"                  # bật /health/ready trên cổng quản trị 9000
      KC_HOSTNAME: http://localhost:8080         # issuer (iss) trong token luôn là địa chỉ này
      # Keycloak thay chỗ ${LAB_USER_PASSWORD} trong idp/realm-topic09.json bằng biến này,
      # nhờ vậy file realm commit được mà không chứa mật khẩu.
      LAB_USER_PASSWORD: ${LAB_USER_PASSWORD:?Hay dat LAB_USER_PASSWORD trong file .env}
      # Tuần 8 — nguồn telemetry thứ 5 (IdP, mục 11.1 đề bài): log dạng JSON để Vector đọc được,
      # và ghi cả sự kiện THÀNH CÔNG (LOGIN, CODE_TO_TOKEN, CLIENT_LOGIN…) ở mức INFO — mặc định
      # Keycloak chỉ ghi sự kiện lỗi (WARN), sự kiện thành công ở DEBUG nên không hiện.
      # Realm đã bật listener "jboss-logging" (idp/realm-topic09.json).
      KC_LOG_CONSOLE_OUTPUT: json
      KC_SPI_EVENTS_LISTENER_JBOSS_LOGGING_SUCCESS_LEVEL: info
    ports:
      - "127.0.0.1:8080:8080"                    # chỉ mở trên localhost, không ra mạng LAN
    volumes:
      - keycloak-data:/opt/keycloak/data         # giữ realm, user qua các lần restart
      - ./idp:/opt/keycloak/data/import:ro       # realm-as-code (tuần 3), chỉ đọc
    networks: [identity]
    healthcheck:
      # Image Keycloak không có curl, nên dùng /dev/tcp của bash để gọi health endpoint.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  orders-api:
    build:
      context: ./workloads
      args:
        SERVICE: orders-api
    image: topic09/orders-api:dev
    environment:
      LISTEN_ADDR: ":8081"
    networks: [backend]                          # KHÔNG có "ports": host không gọi thẳng được
    read_only: true                              # file hệ thống chỉ đọc
    cap_drop: [ALL]                              # bỏ mọi Linux capability
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  profile-api:
    build:
      context: ./workloads
      args:
        SERVICE: profile-api
    image: topic09/profile-api:dev
    environment:
      LISTEN_ADDR: ":8082"
    networks: [backend]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Gateway (PEP) — tuần 4. Image distroless: không shell, chạy uid 65532 (không phải root).
  # Không có healthcheck vì image không có công cụ nào để gọi; smoke test kiểm từ host qua TLS.
  # auth-svc (Go, gRPC ext_authz) — tuần 4 T6: kiểm JWT chặt cho profile P1.
  auth-svc:
    build:
      context: ./gateway/auth-svc
    image: topic09/auth-svc:dev
    environment:
      LISTEN_ADDR: ":9191"
      # Bốn giá trị bảo mật ghi cứng ở đây, không lấy từ token (SR-02):
      OIDC_ISSUER: http://localhost:8080/realms/topic09
      JWKS_URL: http://keycloak:8080/realms/topic09/protocol/openid-connect/certs
      AUDIENCE: topic09-api
      ALLOWED_ALGS: RS256                        # realm topic09 chỉ ký RS256
      TOKEN_TYPE: Bearer                         # claim typ của access token Keycloak
      CLOCK_SKEW: 30s
      JWKS_TTL: 5m
      # Tuần 5: PDP. URL ghi cứng như JWKS_URL; timeout < 0.5 s của ext_authz trong envoy.yaml.
      OPA_URL: http://opa:8181/v1/data/topic09/authz/decision
      OPA_TIMEOUT: 250ms
      # Tuần 6: DPoP cho P2 (RFC 9449). Access token gắn khoá của Keycloak có claim typ=DPoP.
      DPOP_TOKEN_TYPE: DPoP
      DPOP_ALLOWED_ALGS: ES256
      DPOP_IAT_WINDOW: 30s                       # quyết định 2026-10-03
      DPOP_REPLAY_CACHE_MAX: "100000"            # đầy thì từ chối, không xoá mục còn hạn (T10)
    # authz: chỉ Envoy gọi được (TB Envoy → auth-svc); identity: lấy JWKS (TB2a);
    # policy: hỏi OPA (TB2b). KHÔNG có "ports" — host không gọi thẳng auth-svc.
    networks: [authz, identity, policy]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      keycloak: { condition: service_healthy }
      opa: { condition: service_healthy }

  # OPA — PDP (Policy Decision Point), tuần 5. auth-svc hỏi OPA sau khi kiểm token.
  # REST API của OPA mặc định KHÔNG xác thực, nên bảo vệ bằng vị trí mạng (quyết định 2026-10-03):
  # không "ports", chỉ ở mạng "policy" — mạng mà chỉ auth-svc dùng chung. Envoy, backend,
  # Keycloak không gọi được OPA, nên không ai khác hỏi hay đổi được policy qua API (T8).
  opa:
    image: openpolicyagent/opa:1.21.4-static     # ghim phiên bản; image distroless, chạy uid 1000
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181                      # OPA 1.x mặc định chỉ nghe localhost
      - --log-format=json
      - --disable-telemetry                      # không gọi ra ngoài kiểm phiên bản
      # Decision log: mỗi quyết định một dòng JSON ra stdout (tuần 8 Vector gom về SIEM).
      # policy/log_mask.rego xoá input.path trước khi ghi (SR-10).
      - --set=decision_logs.console=true
      - --ignore=*_test.rego                     # file test chỉ dùng cho "opa test", không nạp vào server
      - /policy
    volumes:
      # Policy chỉ đọc: muốn đổi phải sửa file trong git rồi restart (T8 — policy compromise).
      - ./policy:/policy:ro
    networks: [policy]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # Image không có shell/curl → dùng chính binary opa: http.send gọi /health; biểu thức
      # so sánh sai hoặc lỗi kết nối thì "opa eval --fail" thoát mã khác 0.
      test:
        - CMD
        - /opa
        - eval
        - --fail
        - 'http.send({"method": "GET", "url": "http://127.0.0.1:8181/health", "timeout": "2s"}).status_code == 200'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  envoy:
    image: envoyproxy/envoy:distroless-v1.39.4   # ghim phiên bản (quyết định 2026-10-17)
    # --file-flush-interval-msec 1000: đẩy access log ra stdout mỗi 1 s (mặc định 10 s) để SIEM nhận gần thời gian thực.
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info", "--file-flush-interval-msec", "1000"]
    ports:
      - "127.0.0.1:8443:8443"                    # P1 — cổng vào chính tới API, chỉ trên localhost
      - "127.0.0.1:8444:8444"                    # P0 — baseline chỉ jwt_authn, để so sánh (tuần 11)
      - "127.0.0.1:8445:8445"                    # P2 — P1 + DPoP (tuần 6)
    volumes:
      - type: bind
        source: ./gateway/envoy.yaml
        target: /etc/envoy/envoy.yaml
        read_only: true
      # Cert/khoá do ./scripts/gen-certs.sh sinh. create_host_path: false → thiếu file thì
      # compose báo lỗi ngay, thay vì âm thầm tạo một thư mục rỗng trùng tên.
      - type: bind
        source: ./secrets/tls/envoy.crt
        target: /etc/envoy/tls/envoy.crt
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./secrets/tls/envoy.key
        target: /etc/envoy/tls/envoy.key
        read_only: true
        bind: { create_host_path: false }
    # edge: nhận request từ client (TB1a); identity: lấy JWKS của Keycloak (TB2a);
    # authz: gọi auth-svc; backend: chuyển request vào API (TB3).
    # Envoy là service duy nhất nối cả phía client lẫn phía backend.
    networks: [edge, identity, authz, backend]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      keycloak: { condition: service_healthy }
      auth-svc: { condition: service_healthy }
      orders-api: { condition: service_healthy }
      profile-api: { condition: service_healthy }

  # ============================================================ SIEM (tuần 8) ============================================================
  # OpenSearch — kho sự kiện bảo mật. Quyết định 2026-11-13: KHÔNG bật security plugin (không
  # TLS, không tài khoản); bảo vệ bằng vị trí mạng như OPA — không "ports", chỉ ở mạng
  # "telemetry" (internal) mà chỉ Vector dùng chung. Ai vào được mạng này thì đọc/sửa/xoá được
  # log: chống sửa log dựa vào hash chain + digest ký bằng Vault ở tuần 9 (PHÁT HIỆN được, không
  # NGĂN được) — rủi ro còn lại của T9. Xem log:  make siem-search
  opensearch:
    image: opensearchproject/opensearch:3.8.0    # ghim phiên bản (quyết định 2026-11-13)
    environment:
      discovery.type: single-node                # một node, không tìm node khác
      cluster.name: topic09-siem
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"        # không cài chứng chỉ demo (khoá riêng công khai trên mạng)
      DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
      # Phương án dự phòng RAM trong kế hoạch: heap 512 MB (máy lab WSL có 7,7 GiB cho tất cả).
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - opensearch-data:/usr/share/opensearch/data   # giữ sự kiện qua các lần restart
    networks: [telemetry]                        # KHÔNG có "ports": host không gọi thẳng được
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=3s' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # Chạy một lần rồi thoát: nạp mapping "dynamic: strict" của index topic09-events (sinh từ
  # telemetry/schema.json) TRƯỚC khi Vector ghi tài liệu đầu tiên. Dùng lại image OpenSearch vì
  # nó có sẵn curl — không thêm image mới.
  opensearch-init:
    image: opensearchproject/opensearch:3.8.0
    entrypoint: ["sh", "/init/init.sh"]
    volumes:
      - ./telemetry/opensearch:/init:ro
    networks: [telemetry]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    depends_on:
      opensearch: { condition: service_healthy }

  # Vector — đọc log của 6 container, đổi về telemetry/schema.json, băm HMAC định danh, chỉ giữ
  # trường trong schema, che giá trị dạng token, rồi ghi vào OpenSearch (telemetry/vector/vector.yaml).
  #
  # Rủi ro phải biết (T11, TB6): để đọc log, Vector được mount /var/run/docker.sock. Mount "ro"
  # chỉ cấm xoá/đổi tên socket, KHÔNG cấm gọi Docker API — ai điều khiển được Vector thì điều
  # khiển được Docker trên máy. Giảm thiểu: Vector không có "ports", chỉ ở mạng internal, không
  # nhận dữ liệu nào từ mạng, file hệ thống chỉ đọc, bỏ mọi capability.
  vector:
    image: timberio/vector:0.60.0-alpine         # ghim phiên bản (quyết định 2026-11-13); alpine để có wget cho healthcheck
    command: ["--config", "/etc/vector/vector.yaml"]
    environment:
      # Khoá HMAC để giả danh sub/aud (tài sản #14). VRL đọc lúc chạy bằng get_env_var.
      SIEM_HMAC_KEY: ${SIEM_HMAC_KEY:?Hay dat SIEM_HMAC_KEY trong file .env (openssl rand -hex 32)}
    volumes:
      - type: bind
        source: ./telemetry/vector/vector.yaml
        target: /etc/vector/vector.yaml
        read_only: true
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /var/lib/vector                          # data_dir: Vector cần một thư mục ghi được; không lưu gì lâu dài
    networks: [telemetry]                        # KHÔNG có "ports"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8686/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    depends_on:
      opensearch-init: { condition: service_completed_successfully }

networks:
  edge:
    name: topic09-edge                           # client → gateway (TB1a)
  identity:
    name: topic09-identity
  authz:
    name: topic09-authz                          # Envoy ↔ auth-svc
    internal: true
  policy:
    name: topic09-policy                         # auth-svc ↔ OPA (TB2b) — chỉ hai service này
    internal: true
  backend:
    name: topic09-backend
    internal: true                               # mạng kín: không ra Internet, không publish port
  telemetry:
    name: topic09-telemetry                      # Vector ↔ OpenSearch (TB5) — chỉ hai service này
    internal: true

volumes:
  keycloak-data:
  opensearch-data:
