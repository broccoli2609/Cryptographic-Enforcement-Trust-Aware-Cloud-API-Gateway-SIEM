<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="640" viewBox="0 0 1720 640" xmlns:c2pa="http://c2pa.org/manifest"><rect width="100%" height="100%" fill="white"/><defs><marker id="m333" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#333"/></marker><marker id="mb85450" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b85450"/></marker><marker id="m9a5b13" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a5b13"/></marker></defs><text x="24" y="36" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#222" text-anchor="start">Logic xử lý một request ở profile P2 — thứ tự cố định, rẻ trước đắt sau, lỗi thì chặn</text><text x="24" y="60" font-family="DejaVu Sans" font-size="13" font-weight="normal" fill="#555" text-anchor="start">Request: HTTPS + Authorization: DPoP &lt;access token&gt; + header DPoP: &lt;proof&gt;</text><rect x="40" y="100" width="207" height="128" rx="9" fill="#d5e8d4" stroke="#3d6b2a" stroke-width="1.4"/><text x="143.5" y="144.75" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">① Envoy (PEP)</text><text x="143.5" y="162.25" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">kết thúc TLS 1.3</text><text x="143.5" y="178.75" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">xoá X-User client gửi</text><text x="143.5" y="195.25" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">giới hạn kích thước header</text><path d="M247 164 L271 164" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#m333)"/><path d="M143.5 228 L143.5 272" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#mb85450)"/><rect x="53.5" y="272" width="180" height="30" rx="15" fill="#f8cecc" stroke="#b85450"/><text x="143.5" y="292" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#8b2e2a" text-anchor="middle">TLS lỗi → ngắt</text><rect x="271" y="100" width="207" height="128" rx="9" fill="#dae8fc" stroke="#2b4c7e" stroke-width="1.4"/><text x="374.5" y="144.75" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">② Kiểm rẻ</text><text x="374.5" y="162.25" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">kích thước, định dạng JWS</text><text x="374.5" y="178.75" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">alg ∈ allow-list (RS256)</text><text x="374.5" y="195.25" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">kid có trong JWKS cache</text><path d="M478 164 L502 164" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#m333)"/><path d="M374.5 228 L374.5 272" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#mb85450)"/><rect x="319.5" y="272" width="110" height="30" rx="15" fill="#f8cecc" stroke="#b85450"/><text x="374.5" y="292" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#8b2e2a" text-anchor="middle">401</text><rect x="502" y="100" width="207" height="128" rx="9" fill="#dae8fc" stroke="#2b4c7e" stroke-width="1.4"/><text x="605.5" y="144.75" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">③ Chữ ký JWT</text><text x="605.5" y="162.25" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">verify RS256 (crypto/rsa)</text><text x="605.5" y="178.75" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">khoá từ JWKS ghim theo iss</text><text x="605.5" y="195.25" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">bỏ qua jku, x5u, jwk</text><path d="M709 164 L733 164" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#m333)"/><path d="M605.5 228 L605.5 272" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#mb85450)"/><rect x="550.5" y="272" width="110" height="30" rx="15" fill="#f8cecc" stroke="#b85450"/><text x="605.5" y="292" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#8b2e2a" text-anchor="middle">401</text><rect x="733" y="100" width="207" height="128" rx="9" fill="#dae8fc" stroke="#2b4c7e" stroke-width="1.4"/><text x="836.5" y="144.75" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">④ Claim</text><text x="836.5" y="162.25" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">iss, aud, exp, nbf, iat</text><text x="836.5" y="178.75" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">typ: Bearer (P1) / DPoP (P2)</text><text x="836.5" y="195.25" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">không nhận ID token</text><path d="M940 164 L964 164" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#m333)"/><path d="M836.5 228 L836.5 272" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#mb85450)"/><rect x="781.5" y="272" width="110" height="30" rx="15" fill="#f8cecc" stroke="#b85450"/><text x="836.5" y="292" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#8b2e2a" text-anchor="middle">401</text><rect x="964" y="100" width="207" height="128" rx="9" fill="#dae8fc" stroke="#2b4c7e" stroke-width="1.4"/><text x="1067.5" y="144.75" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">⑤ DPoP (P2)</text><text x="1067.5" y="162.25" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">so jkt với cnf.jkt trước</text><text x="1067.5" y="178.75" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">proof ES256: htm, htu, ath</text><text x="1067.5" y="195.25" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">iat ±30 s; ghi jti sau cùng</text><path d="M1171 164 L1195 164" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#m333)"/><path d="M1067.5 228 L1067.5 272" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#mb85450)"/><rect x="1012.5" y="272" width="110" height="30" rx="15" fill="#f8cecc" stroke="#b85450"/><text x="1067.5" y="292" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#8b2e2a" text-anchor="middle">401</text><rect x="1195" y="100" width="207" height="128" rx="9" fill="#e1d5e7" stroke="#6a4c7d" stroke-width="1.4"/><text x="1298.5" y="144.75" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">⑥ OPA (PDP)</text><text x="1298.5" y="162.25" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">RBAC theo route + method</text><text x="1298.5" y="178.75" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">ABAC: dept, tier</text><text x="1298.5" y="195.25" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">trả policy_version, reason</text><path d="M1402 164 L1426 164" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#m333)"/><path d="M1298.5 228 L1298.5 272" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#mb85450)"/><rect x="1208.5" y="272" width="180" height="30" rx="15" fill="#f8cecc" stroke="#b85450"/><text x="1298.5" y="292" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#8b2e2a" text-anchor="middle">403 · OPA lỗi → 503</text><rect x="1426" y="100" width="207" height="128" rx="9" fill="#eeeeee" stroke="#555" stroke-width="1.4"/><text x="1529.5" y="144.75" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">⑦ Backend</text><text x="1529.5" y="162.25" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">owner_id (chống BOLA)</text><text x="1529.5" y="178.75" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">salary_band chỉ cho HR</text><text x="1529.5" y="195.25" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">giải mã qua Vault Transit</text><path d="M1529.5 228 L1529.5 272" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#mb85450)"/><rect x="1439.5" y="272" width="180" height="30" rx="15" fill="#f8cecc" stroke="#b85450"/><text x="1529.5" y="292" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#8b2e2a" text-anchor="middle">403 · Vault lỗi → 503</text><text x="502" y="330" font-family="DejaVu Sans" font-size="13" font-weight="normal" fill="#8b2e2a" text-anchor="start" font-style="italic">auth-svc lỗi → Envoy trả 403 · OPA lỗi hoặc timeout → auth-svc trả 503 (fail-closed hai lớp)</text><defs><linearGradient id="cost" x1="0" x2="1"><stop offset="0" stop-color="#e8f3e3"/><stop offset="1" stop-color="#e3a39b"/></linearGradient></defs><rect x="40" y="352" width="1560" height="34" rx="6" fill="url(#cost)" stroke="#bbb"/><text x="54" y="374" font-family="DejaVu Sans" font-size="13" font-weight="normal" fill="#333" text-anchor="start">Chi phí tính toán tăng dần → request rác bị loại ở bước rẻ, không tốn verify chữ ký hay gọi OPA (chống T10)</text><rect x="1610" y="352" width="70" height="34" rx="6" fill="#d5e8d4" stroke="#3d6b2a"/><text x="1645" y="374" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#3d6b2a" text-anchor="middle">200</text><rect x="40" y="420" width="1640" height="200" rx="10" fill="#fff8ef" stroke="#9a5b13" stroke-dasharray="6 4"/><text x="56" y="446" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#9a5b13" text-anchor="start">Bằng chứng sinh ra song song (trụ Process Logic + Storage)</text><rect x="60" y="466" width="380" height="82" rx="9" fill="#ffe6cc" stroke="#9a5b13" stroke-width="1.4"/><text x="250.0" y="504.0" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">Mỗi bước ghi 1 dòng log JSON</text><text x="250.0" y="521.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">quyết định, lý do, policy_version; không token</text><path d="M440 507 L466 507" fill="none" stroke="#9a5b13" stroke-width="1.6" marker-end="url(#m9a5b13)"/><rect x="466" y="466" width="380" height="82" rx="9" fill="#ffe6cc" stroke="#9a5b13" stroke-width="1.4"/><text x="656.0" y="504.0" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">Vector</text><text x="656.0" y="521.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">HMAC-SHA256 định danh · xoá token · hash chain SHA-256</text><path d="M846 507 L872 507" fill="none" stroke="#9a5b13" stroke-width="1.6" marker-end="url(#m9a5b13)"/><rect x="872" y="466" width="380" height="82" rx="9" fill="#ffe6cc" stroke="#9a5b13" stroke-width="1.4"/><text x="1062.0" y="504.0" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">OpenSearch</text><text x="1062.0" y="521.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">lưu, 6 hunt query, cảnh báo</text><rect x="1278" y="466" width="380" height="82" rx="9" fill="#ffe6cc" stroke="#9a5b13" stroke-width="1.4"/><text x="1468.0" y="504.0" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">digester (5 phút)</text><text x="1468.0" y="521.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">lấy đầu chuỗi từ Vector, ký Ed25519 qua Vault</text><path d="M656.0 548 L656.0 590 L1468 590 L1468 548" fill="none" stroke="#9a5b13" stroke-width="1.6" marker-end="url(#m9a5b13)"/><text x="1062.0" y="582" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#9a5b13" text-anchor="middle" font-style="italic">đầu chuỗi hash (không đọc lại từ OpenSearch)</text></svg>