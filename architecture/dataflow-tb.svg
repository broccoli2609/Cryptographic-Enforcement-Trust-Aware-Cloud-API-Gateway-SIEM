<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1110" viewBox="0 0 1720 1110"><rect width="100%" height="100%" fill="white"/><defs><marker id="m333" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#333"/></marker><marker id="m7a6216" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a6216"/></marker></defs><text x="24" y="36" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#222" text-anchor="start">Luồng dữ liệu F0–F6 và trust boundary TB1a–TB6 (bản cập nhật 13/11/2026)</text><text x="24" y="60" font-family="DejaVu Sans" font-size="13" font-weight="normal" fill="#555" text-anchor="start">Khung đứt nét = một vùng tin cậy · nhãn xanh = luồng F · nhãn đỏ = chỗ vượt ranh giới TB · F3 (service ↔ service, mTLS) ngoài phạm vi</text><rect x="20" y="80" width="1680" height="115" rx="8" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="10 6"/><text x="34" y="102" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#8b2e2a" text-anchor="start">Internet — không tin cậy</text><rect x="60" y="108" width="1600" height="66" rx="9" fill="#ffffff" stroke="#333" stroke-width="1.4"/><text x="860.0" y="138.0" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">Client: CLI · batch-worker · k6 · generator S0–S11</text><text x="860.0" y="155.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">giữ access token và khoá riêng DPoP · bắt đầu F1 (đăng nhập) và F2 (gọi API) — hai luồng duy nhất từ ngoài vào</text><rect x="20" y="240" width="780" height="185" rx="8" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="10 6"/><text x="34" y="262" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#8b2e2a" text-anchor="start">Gateway (PEP)</text><rect x="50" y="285" width="340" height="115" rx="9" fill="#ffffff" stroke="#333" stroke-width="1.4"/><text x="220.0" y="323.5" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">Envoy</text><text x="220.0" y="340.5" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">TLS 1.3 · P0 :8444, P1 :8443, P2 :8445</text><text x="220.0" y="356.5" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">jwt_authn; ext_authz tới auth-svc</text><text x="220.0" y="372.5" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">xoá header danh tính, đặt X-User</text><rect x="440" y="285" width="330" height="115" rx="9" fill="#ffffff" stroke="#333" stroke-width="1.4"/><text x="605.0" y="323.5" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">auth-svc (Go)</text><text x="605.0" y="340.5" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">JWT chặt (SR-02) · DPoP (SR-04)</text><text x="605.0" y="356.5" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">cache jti · hỏi OPA</text><text x="605.0" y="372.5" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">lỗi hoặc timeout thì chặn (SR-11)</text><path d="M390 342 L440 342" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#m333)" marker-start="url(#m333)"/><rect x="1000" y="240" width="700" height="185" rx="8" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="10 6"/><text x="1014" y="262" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#8b2e2a" text-anchor="start">Identity (IdP)</text><rect x="1030" y="285" width="640" height="115" rx="9" fill="#ffffff" stroke="#333" stroke-width="1.4"/><text x="1350.0" y="323.5" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">Keycloak 26.8</text><text x="1350.0" y="340.5" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">Auth Code + PKCE S256 · private_key_jwt (SR-03)</text><text x="1350.0" y="356.5" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">ký access token RS256 · công bố JWKS</text><text x="1350.0" y="372.5" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">gắn cnf.jkt khi có DPoP · admin console chỉ 127.0.0.1</text><rect x="20" y="470" width="780" height="185" rx="8" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="10 6"/><text x="34" y="492" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#8b2e2a" text-anchor="start">Backend nội bộ (network internal, không mở port)</text><rect x="50" y="515" width="340" height="115" rx="9" fill="#ffffff" stroke="#333" stroke-width="1.4"/><text x="220.0" y="553.5" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">orders-api</text><text x="220.0" y="570.5" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">kiểm owner_id (BOLA)</text><text x="220.0" y="586.5" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">kiểm quyền chức năng (BFLA)</text><text x="220.0" y="602.5" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">SR-06</text><rect x="440" y="515" width="330" height="115" rx="9" fill="#ffffff" stroke="#333" stroke-width="1.4"/><text x="605.0" y="553.5" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">profile-api</text><text x="605.0" y="570.5" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">salary_band chỉ HR (SR-06)</text><text x="605.0" y="586.5" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">tuần 10: lưu ciphertext Vault (SR-13)</text><text x="605.0" y="602.5" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">Vault lỗi → 503</text><rect x="1000" y="470" width="400" height="185" rx="8" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="10 6"/><text x="1014" y="492" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#8b2e2a" text-anchor="start">Policy (PDP)</text><rect x="1030" y="515" width="340" height="115" rx="9" fill="#ffffff" stroke="#333" stroke-width="1.4"/><text x="1200.0" y="553.5" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">OPA / Rego</text><text x="1200.0" y="570.5" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">default allow := false</text><text x="1200.0" y="586.5" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">RBAC + ABAC</text><text x="1200.0" y="602.5" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">trả policy_version, reason</text><rect x="20" y="715" width="1340" height="200" rx="8" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="10 6"/><text x="34" y="737" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#8b2e2a" text-anchor="start">Telemetry / SIEM</text><rect x="50" y="755" width="340" height="100" rx="9" fill="#ffffff" stroke="#333" stroke-width="1.4"/><text x="220.0" y="794.0" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">Vector</text><text x="220.0" y="811.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">HMAC-SHA256 định danh, bỏ token</text><text x="220.0" y="827.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">hash chain SHA-256 (SR-09, SR-10)</text><rect x="440" y="755" width="330" height="100" rx="9" fill="#ffffff" stroke="#333" stroke-width="1.4"/><text x="605.0" y="794.0" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">OpenSearch</text><text x="605.0" y="811.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">lưu, tìm kiếm log; 6 hunt query</text><text x="605.0" y="827.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">tắt security plugin, chỉ mạng nội bộ</text><rect x="820" y="755" width="330" height="100" rx="9" fill="#ffffff" stroke="#333" stroke-width="1.4"/><text x="985.0" y="794.0" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">digester (Go, tuần 9)</text><text x="985.0" y="811.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">mỗi 5 phút lấy đầu chuỗi</text><text x="985.0" y="827.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">xin Vault ký digest Ed25519</text><path d="M390 805 L440 805" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#m333)"/><rect x="1400" y="715" width="300" height="200" rx="8" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="10 6"/><text x="1414" y="737" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#8b2e2a" text-anchor="start">KMS</text><rect x="1425" y="755" width="250" height="120" rx="9" fill="#ffffff" stroke="#333" stroke-width="1.4"/><text x="1550.0" y="796.0" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">Vault Transit (tuần 9)</text><text x="1550.0" y="813.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">siem-digest (ed25519)</text><text x="1550.0" y="829.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">pii-enc (aes256-gcm96)</text><text x="1550.0" y="845.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">không export · audit device</text><rect x="20" y="955" width="1680" height="140" rx="8" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="10 6"/><text x="34" y="977" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#8b2e2a" text-anchor="start">Control / Admin — nắm là nắm tất cả (TB6: cấu hình, khoá, chứng chỉ, policy đi tới mọi vùng · F0, F6)</text><rect x="50" y="995" width="520" height="80" rx="9" fill="#ffffff" stroke="#333" stroke-width="1.4"/><text x="310.0" y="1032.0" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">Cấu hình và bí mật</text><text x="310.0" y="1049.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">compose, envoy.yaml, policy .rego, realm export · Docker secrets</text><rect x="600" y="995" width="500" height="80" rx="9" fill="#ffffff" stroke="#333" stroke-width="1.4"/><text x="850.0" y="1032.0" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">CA nội bộ</text><text x="850.0" y="1049.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">cấp chứng chỉ TLS cho Envoy (F0, SR-08)</text><rect x="1130" y="995" width="540" height="80" rx="9" fill="#ffffff" stroke="#333" stroke-width="1.4"/><text x="1400.0" y="1032.0" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">Người vận hành</text><text x="1400.0" y="1049.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">sửa policy, xoay khoá, thu hồi phiên theo runbook (F6, SR-12)</text><path d="M220 174 L220 285" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#m333)"/><rect x="232" y="207" width="30" height="22" rx="11" fill="#dae8fc" stroke="#6c8ebf"/><text x="247.0" y="223" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#1f3b63" text-anchor="middle">F2</text><rect x="268" y="207" width="46" height="22" rx="11" fill="#f8cecc" stroke="#b85450"/><text x="291.0" y="223" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#8b2e2a" text-anchor="middle">TB1a</text><text x="322" y="223" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="start">HTTPS · access token + DPoP proof</text><path d="M1350 174 L1350 285" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#m333)" marker-start="url(#m333)"/><rect x="1362" y="207" width="30" height="22" rx="11" fill="#dae8fc" stroke="#6c8ebf"/><text x="1377.0" y="223" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#1f3b63" text-anchor="middle">F1</text><rect x="1398" y="207" width="46" height="22" rx="11" fill="#f8cecc" stroke="#b85450"/><text x="1421.0" y="223" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#8b2e2a" text-anchor="middle">TB1b</text><text x="1452" y="223" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="start">đăng nhập PKCE, nhận token</text><path d="M1030 342 L770 342" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#m333)"/><rect x="812" y="315" width="30" height="22" rx="11" fill="#dae8fc" stroke="#6c8ebf"/><text x="827.0" y="331" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#1f3b63" text-anchor="middle">F0</text><rect x="848" y="315" width="46" height="22" rx="11" fill="#f8cecc" stroke="#b85450"/><text x="871.0" y="331" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#8b2e2a" text-anchor="middle">TB2a</text><text x="820" y="370" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="start">JWKS (khoá công khai)</text><path d="M220 400 L220 515" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#m333)"/><path d="M330 400 L330 448 L605 448 L605 515" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#m333)"/><rect x="60" y="447" width="30" height="22" rx="11" fill="#dae8fc" stroke="#6c8ebf"/><text x="75.0" y="463" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#1f3b63" text-anchor="middle">F2</text><rect x="96" y="447" width="38" height="22" rx="11" fill="#f8cecc" stroke="#b85450"/><text x="115.0" y="463" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#8b2e2a" text-anchor="middle">TB3</text><path d="M700 400 L700 452 L1200 452 L1200 515" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#m333)"/><rect x="820" y="425" width="30" height="22" rx="11" fill="#dae8fc" stroke="#6c8ebf"/><text x="835.0" y="441" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#1f3b63" text-anchor="middle">F4</text><rect x="856" y="425" width="46" height="22" rx="11" fill="#f8cecc" stroke="#b85450"/><text x="879.0" y="441" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#8b2e2a" text-anchor="middle">TB2b</text><text x="910" y="441" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="start">hỏi allow / deny</text><path d="M220 630 L220 755" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#m333)"/><rect x="232" y="665" width="30" height="22" rx="11" fill="#dae8fc" stroke="#6c8ebf"/><text x="247.0" y="681" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#1f3b63" text-anchor="middle">F5</text><rect x="268" y="665" width="38" height="22" rx="11" fill="#f8cecc" stroke="#b85450"/><text x="287.0" y="681" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#8b2e2a" text-anchor="middle">TB5</text><text x="232" y="706" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="start">log JSON của mọi service + Vault audit</text><path d="M700 630 L700 688 L1550 688 L1550 755" fill="none" stroke="#7a6216" stroke-width="1.8" marker-end="url(#m7a6216)"/><rect x="1000" y="661" width="30" height="22" rx="11" fill="#dae8fc" stroke="#6c8ebf"/><text x="1015.0" y="677" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#1f3b63" text-anchor="middle">F2</text><rect x="1036" y="661" width="38" height="22" rx="11" fill="#f8cecc" stroke="#b85450"/><text x="1055.0" y="677" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#8b2e2a" text-anchor="middle">TB4</text><text x="1082" y="677" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="start">encrypt / decrypt salary_band (mới)</text><path d="M1150 805 L1425 805" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#m333)"/><rect x="1170" y="775" width="30" height="22" rx="11" fill="#dae8fc" stroke="#6c8ebf"/><text x="1185.0" y="791" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#1f3b63" text-anchor="middle">F5</text><rect x="1206" y="775" width="38" height="22" rx="11" fill="#f8cecc" stroke="#b85450"/><text x="1225.0" y="791" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#8b2e2a" text-anchor="middle">TB4</text><text x="1176" y="830" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="start">xin ký digest</text><path d="M220 855 L220 888 L985 888 L985 855" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#m333)"/><text x="600" y="882" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle" font-style="italic">đầu chuỗi hash (không đọc lại từ OpenSearch)</text></svg>